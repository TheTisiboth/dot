
x-ollama-memory-limit: &ollama-memory-limit ${OLLAMA_MEMORY_LIMIT:-5G}
x-ollama-memory-reservation: &ollama-memory-reservation ${OLLAMA_MEMORY_RESERVATION:-4G}

services:
  ollama:
    image: ollama/ollama:latest
    container_name: frisbee-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_NUM_THREADS=4
    deploy:
      resources:
        limits:
          memory: *ollama-memory-limit
        reservations:
          memory: *ollama-memory-reservation
    shm_size: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frisbee-bot:
    build: .
    container_name: frisbee-bot
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3004}:3004"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Telegram Configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TEAM_CHAT_ID=${TEAM_CHAT_ID}
      - TEAM_CHAT_THREAD_ID=${TEAM_CHAT_THREAD_ID}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - TRAINER_CHAT_ID=${TRAINER_CHAT_ID}
      - TRAINER_CHAT_THREAD_ID=${TRAINER_CHAT_THREAD_ID}
      - ENABLE_TRAINER_MESSAGES=${ENABLE_TRAINER_MESSAGES:-true}

      # MTProto user account (required to read reactions - bots cannot)
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}

      # Attendance
      - WINTER_MIN_ATTENDANCE=${WINTER_MIN_ATTENDANCE:-8}
      - SUMMER_MIN_ATTENDANCE=${SUMMER_MIN_ATTENDANCE:-8}
      - REMINDER_HOURS_BEFORE=${REMINDER_HOURS_BEFORE:-3}
      - CANCEL_HOURS_BEFORE=${CANCEL_HOURS_BEFORE:-1}

      # Key-holder message
      - WINTER_KEY_MESSAGE_ENABLED=${WINTER_KEY_MESSAGE_ENABLED:-true}
      - SUMMER_KEY_MESSAGE_ENABLED=${SUMMER_KEY_MESSAGE_ENABLED:-true}

      # Timezone configuration
      - TZ=${TZ:-Europe/Brussels}

      # Ollama Configuration
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      # The ollama service on the compose network, whatever .env says for local dev
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}

      # Season Configuration
      - WINTER_START_DATE=${WINTER_START_DATE:-9:15}
      - WINTER_LOCATION=${WINTER_LOCATION:-Park Arena}
      - WINTER_PRACTICE_DAYS=${WINTER_PRACTICE_DAYS:-2:20:30,6:20:30}
      - WINTER_THROWING_MINUTES_BEFORE=${WINTER_THROWING_MINUTES_BEFORE:-0}

      - SUMMER_START_DATE=${SUMMER_START_DATE:-5:20}
      - SUMMER_LOCATION=${SUMMER_LOCATION:-Beach Courts}
      - SUMMER_PRACTICE_DAYS=${SUMMER_PRACTICE_DAYS:-0:19:00,3:19:00}
      - SUMMER_THROWING_MINUTES_BEFORE=${SUMMER_THROWING_MINUTES_BEFORE:-0}

      # Rules quiz
      - RULES_QUIZ_ENABLED=${RULES_QUIZ_ENABLED:-false}
      - RULES_CHAT_ID=${RULES_CHAT_ID:-}
      - RULES_CHAT_THREAD_ID=${RULES_CHAT_THREAD_ID:-}
      - RULES_ANSWER_DELAY_MINUTES=${RULES_ANSWER_DELAY_MINUTES:-60}
      - RULES_SIGNALS_EVERY_OTHER=${RULES_SIGNALS_EVERY_OTHER:-false}

      # Exceptional training overrides
      - EXCEPTIONAL_LOCATION=${EXCEPTIONAL_LOCATION:-}
      - EXCEPTIONAL_TIME=${EXCEPTIONAL_TIME:-}
      - EXCEPTIONAL_CANCELLED=${EXCEPTIONAL_CANCELLED:-false}


    # Optional: Add volume for logs or persistent data
    # volumes:
    #   - ./logs:/app/logs

    # Health check for the bot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Ollama model downloader (runs once to pull the model)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: frisbee-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"
    network_mode: "service:ollama"

volumes:
  ollama_data:
    driver: local
